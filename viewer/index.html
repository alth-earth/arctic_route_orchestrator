<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arctic Route Replay Viewer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="title">
        <strong>Arctic Route Replay</strong>
        <span id="mode-badge" class="badge">causal_replay</span>
      </div>
      <div class="badges">
        <span id="gate-l1" class="badge gate">L1 -</span>
        <span id="gate-l2" class="badge gate">L2 -</span>
        <span id="gate-loop" class="badge">preflight -</span>
      </div>
    </header>

    <main class="layout">
      <div class="mapwrap">
        <canvas id="map"></canvas>
        <div id="hover-info" class="hover-info"></div>
      </div>

      <aside class="panel">
        <section class="block">
          <div class="sim">
            <button id="play" type="button" class="btn">Pause</button>
            <div id="clock" class="clock">--:--:--</div>
          </div>
          <input id="scrub" type="range" min="0" step="1" value="0" />
          <div class="row">
            <span id="range-label"></span>
            <label>
              speed
              <select id="speed">
                <option value="30">1x</option>
                <option value="60" selected>2x</option>
                <option value="120">4x</option>
                <option value="240">8x</option>
              </select>
            </label>
          </div>
        </section>

        <section class="block legend">
          <h2>Layers</h2>
          <ul>
            <li><i class="sw sw-track"></i>completed track</li>
            <li><i class="sw sw-active"></i>authoritative future route</li>
            <li><i class="sw sw-pending"></i>pending route</li>
            <li><i class="sw sw-superseded"></i>superseded route</li>
            <li><i class="sw sw-segment"></i>current segment</li>
            <li><i class="sw sw-vessel"></i>vessel</li>
          </ul>
        </section>

        <section class="block debug">
          <h2>Debug</h2>
          <dl id="debug"></dl>
        </section>
      </aside>
    </main>
    <script src="app.js"></script>
  </body>
</html>
